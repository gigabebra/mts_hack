{{- if ne (int (add .Values.traffic.stableWeight .Values.traffic.canaryWeight)) 100 -}}
{{- fail "traffic.stableWeight + traffic.canaryWeight must equal 100" -}}
{{- end -}}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gatewayClassName }}
spec:
  controllerName: {{ .Values.controllerName }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  gatewayClassName: {{ .Values.gatewayClassName }}
  listeners:
    - name: web
      protocol: HTTP
      port: {{ .Values.listenerPort }}
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
    {{- if .Values.tls.enabled }}
    - name: websecure
      protocol: HTTPS
      port: {{ .Values.tls.listenerPort }}
      # Match hostnames on HTTPRoute: constraining this listener gives the
      # generic and hostname routes identical effective Host rules in Traefik.
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ .Values.tls.secretName }}
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
    {{- end }}
{{- range $name := list "hello" "hello-host" }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  {{- if eq $name "hello-host" }}
  hostnames:
    - {{ $.Values.tls.hostname | quote }}
  {{- end }}
  parentRefs:
    {{- include "gateway.parents" $ | nindent 4 }}
  rules:
    - matches:
        - path:
            type: Exact
            value: /
        - path:
            type: PathPrefix
            value: /verify
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Gateway-Route
                value: {{ $name }}
      backendRefs:
        {{- include "gateway.backends" $ | nindent 8 }}
{{- end }}
{{- range $track := list "stable" "canary" }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello-{{ $track }}
  namespace: {{ $.Release.Namespace }}
spec:
  parentRefs:
    {{- include "gateway.parents" $ | nindent 4 }}
  rules:
    - matches:
        - path:
            type: Exact
            value: /backend/{{ $track }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ ternary "hello" "hello-canary" (eq $track "stable") }}
          port: 80
          weight: 100
{{- end }}
