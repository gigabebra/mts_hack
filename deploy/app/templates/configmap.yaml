apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
data:
  index.html: {{ ternary "Broken World!" .Values.responseBody (eq .Values.faultMode "wrong-body") | quote }}
  nginx.conf: |
    {{- tpl (.Files.Get "files/nginx.conf") . | nindent 4 }}
