apiVersion: v1
kind: Service
metadata:
  name: {{ include "app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ipFamilyPolicy: {{ ternary "SingleStack" "RequireDualStack" (eq .Values.networkMode "ipv4") }}
  ipFamilies: {{ ternary (list "IPv4") (list "IPv6" "IPv4") (eq .Values.networkMode "ipv4") | toJson }}
  selector:
    app.kubernetes.io/name: hello
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: http
