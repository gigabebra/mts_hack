worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type text/plain;
    server_tokens off;
    sendfile on;
    keepalive_timeout 15;
    client_max_body_size 1m;
    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path /var/cache/nginx/proxy_temp;
    fastcgi_temp_path /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path /var/cache/nginx/uwsgi_temp;
    scgi_temp_path /var/cache/nginx/scgi_temp;

    map $http_x_request_id $safe_request_id {
        default $request_id;
        "~^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$" $http_x_request_id;
    }

    log_format access_json escape=json
        '{"time":"$time_iso8601","request_id":"$safe_request_id",'
        '"method":"$request_method","uri":"$request_uri",'
        '"status":$status,"bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time}';
    access_log /dev/stdout access_json;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        add_header X-Request-ID $safe_request_id always;

        location = /healthz {
            access_log off;
            return 200 "ok";
        }

        location = / {
            try_files /index.html =404;
        }

        location = /verify {
            try_files /index.html =404;
        }

        # The static module opens an absent file and writes a real stderr error.
        # try_files ... =404 and return 404 do not exercise that error path.
        location ^~ /verify/missing/ {
            log_not_found on;
        }

        location / {
            return 404;
        }
    }
}
