images:
  loki: docker.io/grafana/loki:3.6.2
  fluentd: docker.io/grafana/fluent-plugin-loki:3.6.2

# Bootstrap prepares this directory; the integrator overrides from environment.
dataRoot: /var/lib/mts-stack

loki:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 768Mi

fluentd:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
