apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluentd
  labels:
    app.kubernetes.io/name: fluentd
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fluentd
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluentd
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        # Node CRI files and persistent positions are owned by root.
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
          operator: Exists
      containers:
        - name: fluentd
          image: {{ .Values.images.fluentd | quote }}
          imagePullPolicy: IfNotPresent
          command: ["tini", "--", "fluentd"]
          args:
            - --no-supervisor
            - --suppress-config-dump
            - -c
            - /fluentd/etc/fluent.conf
            - -p
            - /fluentd/plugins
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: monitor
              containerPort: 24220
          readinessProbe:
            httpGet:
              path: /api/plugins.json
              port: monitor
            periodSeconds: 5
            initialDelaySeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/plugins.json
              port: monitor
            periodSeconds: 30
            initialDelaySeconds: 15
            timeoutSeconds: 5
          resources:
{{ toYaml .Values.fluentd.resources | indent 12 }}
          volumeMounts:
            - name: config
              mountPath: /fluentd/etc
              readOnly: true
            - name: containers
              mountPath: /var/log/containers
              readOnly: true
            - name: pods
              mountPath: /var/log/pods
              readOnly: true
            - name: data
              mountPath: /var/lib/fluentd
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: logging-config
            items:
              - key: fluent.conf
                path: fluent.conf
        - name: containers
          hostPath:
            path: /var/log/containers
            type: Directory
        - name: pods
          hostPath:
            path: /var/log/pods
            type: Directory
        - name: data
          hostPath:
            path: {{ printf "%s/fluentd" .Values.dataRoot | quote }}
            type: Directory
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
