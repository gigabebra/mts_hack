<system>
  workers 1
  log_level info
  suppress_repeated_stacktrace true
  emit_error_log_interval 30s
</system>

<source>
  @type tail
  @id nginx_cri
  tag nginx.cri
  path /var/log/containers/hello-*_demo_nginx-*.log
  path_key source_file
  pos_file /var/lib/fluentd/nginx.pos
  read_from_head true
  follow_inodes true
  refresh_interval 5s
  rotate_wait 10s
  <parse>
    @type regexp
    expression /^(?<cri_time>\S+) (?<stream>stdout|stderr) (?<cri_flag>[FP]) (?<message>.*)$/
    time_key cri_time
    time_type string
    time_format %Y-%m-%dT%H:%M:%S.%N%:z
    keep_time_key true
  </parse>
</source>

# reserve_data keeps both the raw message and non-JSON stderr records.
# The CRI event time has nanosecond precision and remains the Loki timestamp.
<filter nginx.cri>
  @type parser
  key_name message
  reserve_data true
  reserve_time true
  emit_invalid_record_to_error false
  <parse>
    @type json
    json_parser json
    # Do not interpret Nginx's `time` field as a floating-point epoch.
    time_key __unused_json_time
    estimate_current_event false
  </parse>
</filter>

<source>
  @type monitor_agent
  @id collector_health
  # Fluentd 1.19 HTTP helper constructs a URI from bind, so brackets are required.
  bind {{ ternary "0.0.0.0" "[::]" (eq .Values.networkMode "ipv4") | quote }}
  port 24220
  include_config false
</source>

<match nginx.cri>
  @type loki
  @id loki_output
  url http://loki.{{ .Release.Namespace }}.svc.cluster.local:3100
  line_format json
  extra_labels {"app":"hello","namespace":"demo","container":"nginx"}
  extract_kubernetes_labels false
  include_thread_label false
  <label>
    stream
  </label>
  <buffer>
    @type file
    path /var/lib/fluentd/buffer/loki
    flush_mode interval
    flush_interval 2s
    flush_thread_count 1
    chunk_limit_size 1m
    total_limit_size 256m
    queued_chunks_limit_size 256
    # Back-pressure instead of deliberately discarding oldest chunks.
    overflow_action block
    retry_forever true
    retry_max_interval 30s
    retry_randomize false
    # Leave undelivered data on the persistent hostPath during shutdown.
    flush_at_shutdown false
  </buffer>
</match>
