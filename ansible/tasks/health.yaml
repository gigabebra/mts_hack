---
- name: Confirm the node is Ready
  ansible.builtin.command:
    argv: [kubectl, --kubeconfig, "{{ admin_config }}", wait, --for=condition=Ready, "node/{{ node_name }}", --timeout=300s]
  changed_when: false
- name: Confirm the API readiness endpoint
  ansible.builtin.command:
    argv: [kubectl, --kubeconfig, "{{ admin_config }}", --request-timeout=20s, get, --raw=/readyz]
  changed_when: false
- name: Generate a unique health resource suffix
  ansible.builtin.command: cat /proc/sys/kernel/random/uuid
  register: health_uuid
  changed_when: false
- name: Run a disposable pod network and DNS probe
  block:
    - name: Render health resources
      ansible.builtin.template:
        src: health.yaml.j2
        dest: "{{ remote_state }}/health-{{ health_uuid.stdout }}.yaml"
        mode: '0600'
    - name: Create an isolated server and client on the pod network
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig, "{{ admin_config }}", --request-timeout=30s, apply, -f, "{{ remote_state }}/health-{{ health_uuid.stdout }}.yaml"]
    - name: Wait for the disposable dual-stack HTTP server
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig, "{{ admin_config }}", -n, default, wait, --for=condition=Ready, "pod/mts-health-server-{{ health_uuid.stdout }}", --timeout=180s]
      changed_when: false
    - name: Read the server's real Pod IPs
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig, "{{ admin_config }}", --request-timeout=20s, -n, default, get, pod, "mts-health-server-{{ health_uuid.stdout }}", -o, json]
      register: health_server
      changed_when: false
    - name: Read the two tested ClusterIP services
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig, "{{ admin_config }}", --request-timeout=20s, -n, default, get, services, kubernetes, "mts-health-{{ health_uuid.stdout }}", -o, json]
      register: health_services
      changed_when: false
    - name: Select the workload Service and primary system Service
      ansible.builtin.set_fact:
        health_workload_service: "{{ (health_services.stdout | from_json)['items'] | rejectattr('metadata.name', 'equalto', 'kubernetes') | first }}"
        health_kubernetes_service: "{{ (health_services.stdout | from_json)['items'] | selectattr('metadata.name', 'equalto', 'kubernetes') | first }}"
    - name: Require both workload Service families with IPv6 primary
      ansible.builtin.assert:
        that:
          - health_workload_service.spec.ipFamilies == network.families
          - health_workload_service.spec.ipFamilyPolicy == network.policy
          - health_kubernetes_service.spec.ipFamilies[0] == network.primary
    - name: Validate actual Pod and Service addresses and their primary family
      ansible.builtin.set_fact:
        health_server_addresses: "{{ (health_server.stdout | from_json).status.podIPs | map(attribute='ip') | list | mvp_network_ips(network.mode) }}"
        health_service_addresses: "{{ health_workload_service.spec.clusterIPs | mvp_network_ips(network.mode) }}"
    - name: Record actual addresses for AAAA and A and direct HTTP probes
      ansible.builtin.set_fact:
        health_server_ipv6: "{{ health_server_addresses.ipv6 | default('') }}"
        health_server_ipv4: "{{ health_server_addresses.ipv4 }}"
        health_service_ipv6: "{{ health_service_addresses.ipv6 | default('') }}"
        health_service_ipv4: "{{ health_service_addresses.ipv4 }}"
        health_kubernetes_ipv6: "{{ health_kubernetes_service.spec.clusterIP }}"
        health_kubernetes_ipv4: "{{ health_kubernetes_service.spec.clusterIP }}"
    - name: Render the client with the observed dual-stack destinations
      ansible.builtin.template:
        src: health-client.yaml.j2
        dest: "{{ remote_state }}/health-client-{{ health_uuid.stdout }}.yaml"
        mode: '0600'
    - name: Create the disposable dual-stack client
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig, "{{ admin_config }}", --request-timeout=30s, apply, -f, "{{ remote_state }}/health-client-{{ health_uuid.stdout }}.yaml"]
    - name: Wait for AAAA and A resolution and both Service and direct Pod HTTP paths
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig, "{{ admin_config }}", -n, default, wait, --for=condition=complete, "job/mts-health-{{ health_uuid.stdout }}", --timeout=180s]
      changed_when: false
    - name: Read successful health evidence
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig, "{{ admin_config }}", -n, default, logs, "job/mts-health-{{ health_uuid.stdout }}", --all-containers]
      register: health_result
      changed_when: false
      failed_when: "('MTS_DUAL_AAAA_A_SERVICE_AND_DIRECT_POD_OK' if network.ipv6 else 'MTS_IPV4_A_SERVICE_AND_DIRECT_POD_OK') not in health_result.stdout"
    - name: Read the successful client's actual Pod addresses
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig, "{{ admin_config }}", --request-timeout=20s, -n, default, get, pods, -l, "mts-health-client={{ health_uuid.stdout }}", -o, json]
      register: health_clients
      changed_when: false
    - name: Require exactly one successful client Pod with both addresses
      ansible.builtin.assert:
        that:
          - (health_clients.stdout | from_json)['items'] | length == 1
          - ((health_clients.stdout | from_json)['items'][0].status.podIPs | map(attribute='ip') | list | mvp_network_ips(network.mode)) | length == network.families | length
  rescue:
    - name: Collect bounded client probe output
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig, "{{ admin_config }}", --request-timeout=20s, -n, default, logs, "job/mts-health-{{ health_uuid.stdout }}", --all-containers]
      changed_when: false
      failed_when: false
    - name: Collect bounded health diagnostics
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig, "{{ admin_config }}", --request-timeout=20s, -n, default, get, pods, -l, "mts-health-run={{ health_uuid.stdout }}", -o, wide]
      changed_when: false
      failed_when: false
    - name: Propagate health failure
      ansible.builtin.fail:
        msg: DNS or pod network health check failed; inspect cluster events and CNI before retry.
  always:
    - name: Remove health workload resources
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig, "{{ admin_config }}", --request-timeout=30s, -n, default, delete, 'pod,service,job', -l, "mts-health-run={{ health_uuid.stdout }}", --ignore-not-found=true, --wait=true, --timeout=60s]
    - name: Remove health manifest
      ansible.builtin.file:
        path: "{{ remote_state }}/{{ item }}-{{ health_uuid.stdout }}.yaml"
        state: absent
      loop: [health, health-client]
