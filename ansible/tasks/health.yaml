---
- name: Confirm the node is Ready
  ansible.builtin.command:
    argv: [kubectl, --kubeconfig, "{{ admin_config }}", wait, --for=condition=Ready, "node/{{ node_name }}", --timeout=300s]
  changed_when: false
- name: Confirm the API readiness endpoint
  ansible.builtin.command:
    argv: [kubectl, --kubeconfig, "{{ admin_config }}", --request-timeout=20s, get, --raw=/readyz]
  changed_when: false
- name: Generate a unique health resource suffix
  ansible.builtin.command: cat /proc/sys/kernel/random/uuid
  register: health_uuid
  changed_when: false
- name: Run a disposable pod network and DNS probe
  block:
    - name: Render health resources
      ansible.builtin.template:
        src: health.yaml.j2
        dest: "{{ remote_state }}/health-{{ health_uuid.stdout }}.yaml"
        mode: '0600'
    - name: Create an isolated server and client on the pod network
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig, "{{ admin_config }}", --request-timeout=30s, apply, -f, "{{ remote_state }}/health-{{ health_uuid.stdout }}.yaml"]
    - name: Wait for the disposable IPv6 HTTP server
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig, "{{ admin_config }}", -n, default, wait, --for=condition=Ready, "pod/mts-health-server-{{ health_uuid.stdout }}", --timeout=180s]
      changed_when: false
    - name: Read the server's real Pod IPs
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig, "{{ admin_config }}", --request-timeout=20s, -n, default, get, pod, "mts-health-server-{{ health_uuid.stdout }}", -o, json]
      register: health_server
      changed_when: false
    - name: Read the two tested ClusterIP services
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig, "{{ admin_config }}", --request-timeout=20s, -n, default, get, services, kubernetes, "mts-health-{{ health_uuid.stdout }}", -o, json]
      register: health_services
      changed_when: false
    - name: Require one IPv6 address for the server and both Services
      ansible.builtin.assert:
        that:
          - (health_server.stdout | from_json).status.podIPs | length == 1
          - "':' in (health_server.stdout | from_json).status.podIP"
          - item.spec.ipFamilies == ['IPv6']
          - item.spec.clusterIPs | length == 1
          - "':' in item.spec.clusterIP"
      loop: "{{ (health_services.stdout | from_json)['items'] }}"
      loop_control:
        label: "{{ item.metadata.name }}"
    - name: Record the actual IPv6 addresses for DNS and direct Pod probes
      ansible.builtin.set_fact:
        health_server_ipv6: "{{ (health_server.stdout | from_json).status.podIP }}"
        health_service_ipv6: "{{ ((health_services.stdout | from_json)['items'] | rejectattr('metadata.name', 'equalto', 'kubernetes') | first).spec.clusterIP }}"
        health_kubernetes_ipv6: "{{ ((health_services.stdout | from_json)['items'] | selectattr('metadata.name', 'equalto', 'kubernetes') | first).spec.clusterIP }}"
    - name: Render the client with the observed IPv6 destinations
      ansible.builtin.template:
        src: health-client.yaml.j2
        dest: "{{ remote_state }}/health-client-{{ health_uuid.stdout }}.yaml"
        mode: '0600'
    - name: Create the disposable IPv6 client
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig, "{{ admin_config }}", --request-timeout=30s, apply, -f, "{{ remote_state }}/health-client-{{ health_uuid.stdout }}.yaml"]
    - name: Wait for real AAAA resolution and IPv6 Service and direct cross-pod HTTP
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig, "{{ admin_config }}", -n, default, wait, --for=condition=complete, "job/mts-health-{{ health_uuid.stdout }}", --timeout=180s]
      changed_when: false
    - name: Read successful health evidence
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig, "{{ admin_config }}", -n, default, logs, "job/mts-health-{{ health_uuid.stdout }}", --all-containers]
      register: health_result
      changed_when: false
      failed_when: "'MTS_IPV6_AAAA_SERVICE_AND_DIRECT_POD_OK' not in health_result.stdout"
  rescue:
    - name: Collect bounded health diagnostics
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig, "{{ admin_config }}", --request-timeout=20s, -n, default, get, pods, -l, "mts-health-run={{ health_uuid.stdout }}", -o, wide]
      changed_when: false
      failed_when: false
    - name: Propagate health failure
      ansible.builtin.fail:
        msg: DNS or pod network health check failed; inspect cluster events and CNI before retry.
  always:
    - name: Remove health workload resources
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig, "{{ admin_config }}", --request-timeout=30s, -n, default, delete, 'pod,service,job', -l, "mts-health-run={{ health_uuid.stdout }}", --ignore-not-found=true, --wait=true, --timeout=60s]
    - name: Remove health manifest
      ansible.builtin.file:
        path: "{{ remote_state }}/{{ item }}-{{ health_uuid.stdout }}.yaml"
        state: absent
      loop: [health, health-client]
