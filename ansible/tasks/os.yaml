---
- name: Set stable hostname
  ansible.builtin.hostname:
    name: "{{ node_name }}"
- name: Ensure cloud-init configuration directory exists on ISO installs too
  ansible.builtin.file:
    path: /etc/cloud/cloud.cfg.d
    state: directory
    mode: '0755'
- name: Preserve hostname across cloud-init boots
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-mts-hostname.cfg
    content: "preserve_hostname: true\n"
    mode: '0644'
- name: Resolve the node hostname locally
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: "^{{ node_ip | regex_escape }}\\s"
    line: "{{ node_ip }} {{ node_name }}"
- name: Remove former IPv6-only SSH restrictions on the identified dual-stack VM
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/ssh/sshd_config.d/00-mts-ipv6.conf
    - /etc/systemd/system/ssh.socket.d/99-mts-ipv6.conf
  register: ssh_legacy_cleanup
- name: Configure SSH for both address families
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-mts-network.conf
    mode: '0644'
    content: |
      {% if network.ipv6 %}
      AddressFamily any
      {% else %}
      AddressFamily inet
      {% endif %}
      ListenAddress 0.0.0.0
      {% if network.ipv6 %}
      ListenAddress ::
      {% endif %}
      Port {{ ssh_port | default(22) }}
  register: ssh_network_config
- name: Validate complete SSH configuration before restarting its listener
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
- name: Inspect Ubuntu SSH socket activation
  ansible.builtin.command: systemctl is-active ssh.socket
  register: ssh_socket_active
  changed_when: false
  failed_when: false
- name: Create an override directory for Ubuntu SSH socket activation
  ansible.builtin.file:
    path: /etc/systemd/system/ssh.socket.d
    state: directory
    mode: '0755'
- name: Make the systemd SSH listener accept IPv6 and IPv4
  ansible.builtin.copy:
    dest: /etc/systemd/system/ssh.socket.d/99-mts-network.conf
    mode: '0644'
    content: |
      [Socket]
      ListenStream=
      {% if network.ipv6 %}
      ListenStream=[::]:{{ ssh_port | default(22) }}
      BindIPv6Only=both
      {% else %}
      ListenStream=0.0.0.0:{{ ssh_port | default(22) }}
      {% endif %}
  register: ssh_network_socket
- name: Confirm SSH restart preserves established child sessions
  ansible.builtin.command: systemctl show ssh.service --property=KillMode --value
  register: ssh_kill_mode
  changed_when: false
  failed_when: ssh_kill_mode.stdout != 'process'
  when: ssh_network_config.changed or ssh_network_socket.changed or ssh_legacy_cleanup.changed
- name: Reload SSH unit overrides before changing its listener
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: ssh_network_config.changed or ssh_network_socket.changed or ssh_legacy_cleanup.changed
- name: Restart SSH socket and master in one ordered systemd transaction
  ansible.builtin.command:
    argv: [systemctl, restart, ssh.socket, ssh.service]
  when:
    - ssh_socket_active.stdout == 'active'
    - ssh_network_config.changed or ssh_network_socket.changed or ssh_legacy_cleanup.changed
- name: Restart the SSH master on installations without socket activation
  ansible.builtin.systemd_service:
    name: ssh.service
    state: restarted
  when:
    - ssh_socket_active.stdout != 'active'
    - ssh_network_config.changed or ssh_network_socket.changed or ssh_legacy_cleanup.changed
- name: Confirm the explicit SSH connection still works
  ansible.builtin.wait_for_connection:
    timeout: 60
  when: ssh_network_config.changed or ssh_network_socket.changed or ssh_legacy_cleanup.changed
- name: Install OS prerequisites through signed Ubuntu repositories
  ansible.builtin.apt:
    name: [ca-certificates, curl, gpg, conntrack, socat, iptables, ethtool, python3, python3-apt, systemd-timesyncd]
    state: present
    update_cache: true
    cache_valid_time: 3600
- name: Create the time synchronization override directory
  ansible.builtin.file:
    path: /etc/systemd/timesyncd.conf.d
    state: directory
    mode: '0755'
- name: Configure NTP with explicit servers of either family
  ansible.builtin.copy:
    dest: /etc/systemd/timesyncd.conf.d/99-mts-network.conf
    mode: '0644'
    content: |
      [Time]
      NTP={{ ntp_servers | default(['2606:4700:f1::123'] if network_mode | default('dual-stack') == 'dual-stack' else ['162.159.200.1']) | mvp_servers(network_mode | default('dual-stack')) | join(' ') }}
      FallbackNTP={{ ntp_servers | default(['2606:4700:f1::123'] if network_mode | default('dual-stack') == 'dual-stack' else ['162.159.200.1']) | mvp_servers(network_mode | default('dual-stack')) | join(' ') }}
  register: ntp_network_config
- name: Remove former NTP family restrictions
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/timesyncd.conf.d/99-mts-ipv6.conf
    - /etc/systemd/system/systemd-timesyncd.service.d/99-mts-ipv6.conf
  register: ntp_legacy_cleanup
- name: Enable time synchronization without an address-family packet filter
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    daemon_reload: "{{ ntp_legacy_cleanup.changed }}"
    state: "{{ (ntp_network_config.changed or ntp_legacy_cleanup.changed) | ternary('restarted', 'started') }}"
    enabled: true
- name: Create the resolver override directory
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    mode: '0755'
- name: Prefer explicit DNS upstreams over DHCP resolver defaults
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/99-mts-network.conf
    mode: '0644'
    content: |
      [Resolve]
      DNS={{ dns_servers | mvp_servers | join(' ') }}
      FallbackDNS=
      Domains=~.
  register: dns_network_config
- name: Remove the former IPv6-only resolver override
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d/99-mts-ipv6.conf
    state: absent
  register: dns_legacy_cleanup
- name: Enable the configured DNS upstreams
  ansible.builtin.systemd_service:
    name: systemd-resolved
    state: "{{ (dns_network_config.changed or dns_legacy_cleanup.changed) | ternary('restarted', 'started') }}"
    enabled: true
- name: Wait for synchronized wall clock
  ansible.builtin.command: timedatectl show --property=NTPSynchronized --value
  register: ntp_sync
  changed_when: false
  until: ntp_sync.stdout == 'yes'
  retries: 24
  delay: 5
- name: Disable active swap
  ansible.builtin.command: swapoff -a
  when: ansible_facts.swaptotal_mb > 0
- name: Disable persistent swap entries
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(?!#)(\S+\s+\S+\s+swap\s+.*)$'
    replace: '# mts disabled swap: \1'
- name: Persist required kernel modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/mts-kubernetes.conf
    content: "overlay\nbr_netfilter\n"
    mode: '0644'
- name: Load kernel modules
  ansible.builtin.command:
    argv: [modprobe, "{{ item }}"]
  loop: [overlay, br_netfilter]
  changed_when: false
- name: Persist Kubernetes networking sysctls
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-mts-kubernetes.conf
    mode: '0644'
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.ipv4.ip_forward = 1
      {% if network.ipv6 %}
      # Accept router advertisements before enabling forwarding, including
      # the existing uplink (default applies only to newly created devices).
      net.ipv6.conf.all.accept_ra = 2
      net.ipv6.conf.default.accept_ra = 2
      net/ipv6/conf/{{ node_interface }}/accept_ra = 2
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv6.bindv6only = 0
      net.ipv6.conf.all.forwarding = 1
      net.ipv6.conf.default.forwarding = 1
      {% endif %}
  register: sysctl_config
- name: Apply required sysctls
  ansible.builtin.command: sysctl --load=/etc/sysctl.d/99-mts-kubernetes.conf
  changed_when: sysctl_config.changed
- name: Create bootstrap directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ remote_state }}"
    - "{{ remote_state }}/patches"
    - "{{ remote_cache }}"
    - /etc/containerd
    - /etc/apt/keyrings
    - /opt/cni/bin
    - /usr/local/sbin
    - "{{ data_root }}"
- name: Give Kubernetes DNS the explicit recursive resolver list
  ansible.builtin.copy:
    dest: "{{ remote_state }}/resolv.conf"
    mode: '0644'
    content: |
      # Managed by mts bootstrap; IPv6 and IPv4 upstreams are both allowed.
      {% for resolver in dns_servers | mvp_servers %}
      nameserver {{ resolver }}
      {% endfor %}
      options timeout:2 attempts:3
