# Copy to ubuntu.local.yaml; replace documentation addresses and key path.
# The wrapper builds an explicit single-host inventory group named mvp.
node_name: mts-mvp
node_ip: 2001:db8:20::10
ssh_host: 2001:db8:20::10
ssh_user: ubuntu
ssh_private_key_file: ~/.ssh/id_ed25519
ssh_port: 22
pod_cidr: fd4d:5453:1000:100::/56
service_cidr: fd4d:5453:1000:200::/112
# Reachable recursive resolvers for pod/CoreDNS upstream traffic, IPv6 only.
dns_servers: [2606:4700:4700::1111, 2001:4860:4860::8888]
ntp_servers: [2606:4700:f1::123]
node_port: 30080
kubeconfig: .state/ubuntu/admin.kubeconfig
data_root: /var/lib/mts-stack
